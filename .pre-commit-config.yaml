# Local pre-commit hooks. Install once: `uv run pre-commit install`.
# Versions here are refreshed by `uv run pre-commit autoupdate`.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: banned-imports
        name: banned-imports (no in-process AGPL)
        entry: python scripts/check_banned_imports.py
        language: system
        pass_filenames: false
