name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Sync (locked)
        run: uv sync --locked --all-extras

      - name: Lint (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Banned imports (no in-process AGPL)
        run: uv run python scripts/check_banned_imports.py

      - name: Licence gate (allowlist)
        run: uv run python scripts/check_licenses.py

      - name: Tests
        run: uv run pytest

      - name: SBOM (CycloneDX)
        run: uv run cyclonedx-py environment --output-format json -o bom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: bom.json

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
      - name: Scan git history for secrets
        run: |
          "$RUNNER_TEMP/gitleaks" git . --redact --no-banner --exit-code 1
