[project]
name = "speade-pdf-remediation"
version = "0.0.1"
description = "On-prem PDF remediation pipeline for the UCC SPEADE accessibility programme (WCAG 2.1 AA / PDF-UA), with a mandatory human verification gate."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "SPEADE Student Partners" }]

# Runtime deps for the F1 skeleton ONLY (config / CLI / validation models).
# Heavy stage engines (pypdf, pikepdf, ocrmypdf, docling, torch, ...)
# are added in optional groups when their stage lands — keeping the base small,
# per Aaron's small-stack condition.
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "python-dotenv>=1.0",
]

[project.scripts]
speade = "speade.cli:main"

# Stage engines, installed only when that stage is built (uv: `uv sync --extra detect`).
# Declared now so versions resolve into one lockfile; NOT installed by default.
[project.optional-dependencies]
detect = ["pypdf>=6.14"]
# PDF/UA conformance finish (MarkInfo + pdfuaid) for the tag stage. The tagging
# ENGINE (OpenDataLoader) is a system/subprocess tool + JRE, NOT a pip dep.
tag = ["pikepdf>=10.9"]                    # MPL-2.0 (weak-copyleft, permitted); bundles QPDF
# Stage 3 (stretch): pypdfium2 renders pages (BSD/Apache, self-contained wheel),
# Tesseract OCRs them (SYSTEM install, arms-length subprocess), pikepdf merges.
ocr = ["pikepdf>=10.9", "pypdfium2>=4"]
# The desktop review client: a pywebview (BSD) native window hosting ui/ over
# the js_api bridge -- no web framework, no server (frontend-delivery record).
desktop = ["pywebview>=5.1"]
# The localhost web client: the SAME ui/ served from a 127.0.0.1-only FastAPI
# app (second delivery of the one UI; no hosting, no auth -- it never leaves
# the machine). fastapi MIT, uvicorn BSD, python-multipart Apache-2.0.
web = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9"]
# struct = ["docling-slim>=2.107"]         # structure parser; use -slim to AVOID pulling torch
# NOTE: no LLM/VLM client (ollama, etc.) — the alt-text stage is ruled out; alt-text is human-authored.

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    # pypdf is also a `detect` runtime extra; listed here so `uv sync && pytest`
    # exercises test_detect without needing `--extra detect`.
    "pypdf>=6.14",
    "cyclonedx-bom>=4",
    "pre-commit>=3.7",
    # transport for fastapi.testclient in test_web (the web extra's own tests).
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/speade"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
