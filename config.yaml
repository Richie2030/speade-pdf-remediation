# SPEADE pipeline configuration — NON-SECRET defaults, safe to commit.
#
# Secrets (any runtime tokens) are NEVER stored here. They are resolved at
# runtime from the environment / a 0600 file outside the repo (see .env.example).
#
# Every stage maps to a swappable implementation selected by name — a swap is a
# config edit, not a code edit (the tool-agnostic stage interface, plan §1d).

io:
  # The offline core runs against a local folder -- the only document source.
  local:
    inbox: ./data/inbox    # drop source PDFs here
    outbox: ./data/outbox  # remediated copies + sidecars are written here

pipeline:
  # stage_role: implementation_name  (see `speade stages` for available impls)
  stages:
    passthrough: noop      # default (offline, runs anywhere; no external tools)
    # Real born-digital remediation pipeline — replace the line above with these,
    # in order (stages run top-to-bottom):
    #   detect: detect      # Stage 2 — born-digital vs scanned   (needs: uv sync --extra detect)
    #   ocr: ocr            # Stage 3 (stretch) — scanned only     (needs: --extra ocr + system Tesseract)
    #   tag: tag            # Stage 4 — PDF/UA tagging via OpenDataLoader
    #                       #   (needs: --extra tag + system Java 11+ + the opendataloader-pdf CLI)
    # (no alt-text/VLM stage — ruled out; figure alt-text is human-authored at the gate)

validation:
  verapdf:
    profile: ua1           # PDF/UA-1 (F4 harness pins the exact release + image)
    # Runner preference: `path` below if set -> `verapdf` on PATH (the plain Java
    # CLI -- no Docker; the JRE is already required for the tag engine) -> the
    # pinned Docker image -> fail closed. Set `path` only if veraPDF is installed
    # somewhere PATH can't see (keep machine-specific paths out of commits).
    # path: C:/verapdf/verapdf.bat

audit:
  log_path: ./data/audit/audit.jsonl
